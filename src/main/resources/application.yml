server:
  port: 8080

spring:
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
  datasource:
    url: jdbc:mysql://localhost:3306/quant_stock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 默认连 MySQL；仍不强制 Redis
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.quant.stock.market.dto,com.quant.stock.backtest.dto

management:
  endpoints:
    web:
      exposure:
        include: health,info

quant:
  stock-codes: 600036,000001,300059,601318,000858,600519,000568,002415,600276,601166
  max-single-position: 0.3
  max-total-position: 0.8
  fee-rate: 0.0003
  slip-point: 0.001
  base-atr: 0.05
  atr-min-threshold: 0.001
  batch-pool-size: 10
  # 交易候选池上限；实盘分钟扫描只打池内，不扫全市场
  trade-pool-max: 30
  # 目标池多因子：最低综合分；上市满 N 天；均成交额下限（元，0=关闭；生产可设 50000000）
  pool-score-min: 45
  pool-min-list-days: 60
  pool-min-avg-amount20: 0
  # db：读 MySQL market_1min（更大周期内存聚合）；空库启动从 classpath 灌 1 分钟种子
  market-mode: db
  # 单活策略 id（maCross=金叉默认；holdNothing=永不交易占位，用于切换验证）
  active-strategy: maCross
  mock-bar-days: 15
  db-enabled: true

  # ---- 策略过滤 ----
  trend-filter-enabled: false
  volume-filter-enabled: false
  volume-confirm-ratio: 1.2
  adx-filter-enabled: false
  adx-min: 25
  adx-chop-max: 20
  rsi-buy-max: 60

  # ---- 止损止盈 ----
  stop-loss-enabled: true
  atr-stop-multiplier: 2.0
  hard-stop-capital-pct: 0.02
  trailing-stop-enabled: true
  trailing-atr-multiplier: 1.5
  # 最大持仓交易日；0=关闭（P0-114 时间止损）
  max-hold-trading-days: 0

  # ---- 金字塔 ----
  pyramid-enabled: true
  pyramid-first: 0.50
  pyramid-second: 0.30
  pyramid-third: 0.20
  pyramid-add-pct: 0.01

  # ---- 账户熔断 ----
  daily-loss-limit-pct: 0.03
  consecutive-loss-limit: 5
  drawdown-reduce-pct: 0.15
  drawdown-halt-pct: 0.25
  # 回撤持续期双门禁（P0-122）：低于峰值满 N 日降仓 / 满 M 日熔断；0=关闭该项
  drawdown-duration-reduce-days: 10
  drawdown-duration-halt-days: 30
  # 持续期熔断自动退役 + 冷却交易日（P0-92）
  auto-retire-on-duration-halt: true
  retirement-cooldown-trading-days: 20
  # 组合相关监控（P0-105，只告警）
  correlation-lookback-days: 60
  correlation-warn-threshold: 0.75
  # 告警分级冷却 + 软预算线（P0-97；硬顶仍为 max-total/single-position）
  alert-cooldown-warn-minutes: 240
  alert-cooldown-critical-minutes: 60
  soft-total-position-pct: 0.70
  soft-single-position-pct: 0.25
  # 限价保护：成交价夹紧涨跌停（P0-94；无五档时仅此+ADV 帽）
  limit-price-protect-enabled: true
  # 回测部成比例（P0-95）；1=满额；<1 残量挂单保留
  backtest-fill-ratio: 1.0
  # 压力情景（P0-96）：ADV断崖降仓；不改金叉
  stress-scenario-enabled: true
  stress-adv-cliff-ratio: 0.40
  # 信号漂移（P0-90）：滚动胜率+MA价差IC；默认不自动退役
  signal-drift-enabled: true
  drift-lookback-rounds: 20
  drift-min-win-rate: 0.35
  drift-ic-lookback-days: 60
  drift-min-ic: 0.02
  drift-confirm-rounds: 3
  auto-retire-on-signal-drift: false
  # 多源对账闸（P0-107）：日线 vs 分钟聚合；默认告警不阻断
  data-reconcile-gate-enabled: true
  data-reconcile-block-on-diverge: false
  data-reconcile-max-close-diff-pct: 0.02
  data-reconcile-sample-days: 5
  # 扩容降频 + POV（P0-112）
  capacity-aum-base: 100000
  pov-max-bar-volume-pct: 0.10
  # 结构突变（P0-120）：挂漂移/降仓，不改金叉
  structural-break-enabled: true
  structural-break-window: 20
  structural-break-threshold: 2.0
  structural-break-confirm-bars: 2
  # ST 开仓过滤（P0-101）：as-of 日切优先；财报时钟本地无数据
  st-open-filter-enabled: true
  # 换手 L1（P0-104）：日成交额/权益；软顶降仓硬顶禁开
  turnover-guard-enabled: true
  turnover-soft-pct: 0.50
  turnover-hard-pct: 1.00
  # IC 衰减（P0-125）：滚动 IC 半衰期/IR；只降仓
  ic-decay-enabled: true
  ic-decay-lookback: 40
  ic-decay-min-half-life-bars: 5
  ic-decay-min-ir: 0.10
  # 实验种子（P0-93）：进配置指纹；默认空
  experiment-seed: ""

  # ---- 旁路会话引擎（MIN_1 三分支；不影响经典金叉）----
  session:
    open-start: "09:30"
    open-end: "10:00"
    mid-start: "10:00"
    mid-end: "14:30"
    close-start: "14:30"
    close-end: "15:00"
    matching-enabled: true
    # AUTO=跟随 next-bar-open-fill；NEXT_EFFECTIVE=次日≥09:45开盘；BAR_CLOSE=当根收盘
    fill-mode: AUTO
    # 激活策略为 SessionStrategy 时，纸面分钟扫描走会话钩子（脚手架默认不下单）
    paper-enabled: true

  # ---- 开仓过滤 ----
  quiet-open-enabled: true
  quiet-close-enabled: true
  min-avg-volume20: 1000
  min-market-cap-yi: 50
  market-cap-filter-enabled: true
  trade-mode: sim

  # ---- 真实成本 ----
  stamp-tax-rate: 0.001
  slip-large: 0.0005
  slip-mid: 0.002
  slip-small: 0.005
  vol-large-threshold: 20000000
  vol-mid-threshold: 5000000
  impact-coeff: 0.1
  # 单笔最大参与率（相对近20日均量）；≤0 关闭；止损/熔断卖出不受限
  max-participation-adv: 0.10
  next-bar-open-fill: true

  # ---- 定时任务总闸；各任务以 MySQL sys_schedule_job 为准（种子默认全关，页面可启停/改 cron）----
  schedule:
    enabled: true

  # ---- 安全与运维 ----
  api-key: ${QUANT_API_KEY:}
  rate-limit-per-minute: ${QUANT_RATE_LIMIT:30}
  history-dir: ${QUANT_HISTORY_DIR:data/backtest}

logging:
  level:
    com.quant.stock: INFO
    com.quant.stock.mapper: INFO
