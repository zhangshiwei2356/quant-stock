<!-- 首页仪表盘：由 stock.html 的 #viewHome 加载 -->
<section class="panel home-panel home-dashboard" id="homePanel">
  <div class="home-dash-head">
    <h3 class="home-title">工作台</h3>
    <p class="home-dash-sub">本地模拟账本与运维概览 · 数据不可用时显示「—」</p>
  </div>

  <div class="home-metrics" id="homeMetrics">
    <article class="home-metric-card" data-metric="equity">
      <div class="home-metric-label">总资产</div>
      <div class="home-metric-value" id="homeMetricEquity">—</div>
      <div class="home-metric-hint" id="homeMetricEquityHint">本地模拟</div>
    </article>
    <article class="home-metric-card" data-metric="dayPnl">
      <div class="home-metric-label">今日盈亏</div>
      <div class="home-metric-value" id="homeMetricDayPnl">—</div>
      <div class="home-metric-hint" id="homeMetricDayPnlHint">相对昨收权益</div>
    </article>
    <article class="home-metric-card" data-metric="strategy">
      <div class="home-metric-label">运行中策略</div>
      <div class="home-metric-value home-metric-value--sm" id="homeMetricStrategy">—</div>
      <div class="home-metric-hint" id="homeMetricStrategyHint">纸面激活</div>
    </article>
    <article class="home-metric-card" data-metric="alerts">
      <div class="home-metric-label">待处理告警</div>
      <div class="home-metric-value" id="homeMetricAlerts">—</div>
      <div class="home-metric-hint" id="homeMetricAlertsHint">数据健康覆盖</div>
    </article>
  </div>

  <div class="home-recent" id="homeRecent" hidden>
    <h4 class="home-section-title">最近访问</h4>
    <div class="home-recent-list" id="homeRecentList"></div>
  </div>

  <div class="home-entry-groups" id="homeEntryGroups">
    <section class="home-entry-group">
      <h4 class="home-section-title">核心分析</h4>
      <div class="home-entry-grid">
        <button type="button" class="home-entry-card" data-enter="pool">
          <span class="home-entry-name">行情浏览</span>
          <span class="home-entry-desc">全市场选股与多周期 K 线</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="single">
          <span class="home-entry-name">个股回测</span>
          <span class="home-entry-desc">目标池单股回测 / 扫描 / 历史</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="portfolio">
          <span class="home-entry-name">组合回测</span>
          <span class="home-entry-desc">多股共享资金池回测</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="strategy">
          <span class="home-entry-name">策略管理</span>
          <span class="home-entry-desc">策略总览与评分</span>
        </button>
      </div>
    </section>
    <section class="home-entry-group">
      <h4 class="home-section-title">交易管理</h4>
      <div class="home-entry-grid">
        <button type="button" class="home-entry-card" data-enter="tradepool">
          <span class="home-entry-name">目标池</span>
          <span class="home-entry-desc">扫描入池与池内标的</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="account">
          <span class="home-entry-name">账户概览</span>
          <span class="home-entry-desc">资金、持仓与风控</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="schedule">
          <span class="home-entry-name">运维中心</span>
          <span class="home-entry-desc">任务、健康与运行参数</span>
        </button>
      </div>
    </section>
    <section class="home-entry-group">
      <h4 class="home-section-title">辅助工具</h4>
      <div class="home-entry-grid">
        <button type="button" class="home-entry-card" data-enter="dbtables">
          <span class="home-entry-name">数据表</span>
          <span class="home-entry-desc">白名单表只读浏览</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="kuangrui">
          <span class="home-entry-name">宽睿对接</span>
          <span class="home-entry-desc">OES / MDS 联调</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="knowledge">
          <span class="home-entry-name">量化知识</span>
          <span class="home-entry-desc">指标与交易规则文档</span>
        </button>
        <button type="button" class="home-entry-card" data-enter="app">
          <span class="home-entry-name">应用说明</span>
          <span class="home-entry-desc">概述、README、能力与待办</span>
        </button>
      </div>
    </section>
  </div>

  <!-- 无 JS 回退：与侧栏一级对齐的简入口 -->
  <div class="home-actions" id="homeActions" hidden></div>
</section>
