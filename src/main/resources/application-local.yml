# 本机默认 profile（application.yml → spring.profiles.active=local）
# 仅放开关与路径覆盖；账号/密码用环境变量或 config/kuangrui/local/credentials.ps1，勿写入本文件。
# 真客户端仍须：Maven profile kuangrui（IDEA 勾选）+ 本机已 install quant360 jar。
#
# 关闭本机覆盖：启动参数加 --spring.profiles.active=default
# 或环境变量 SPRING_PROFILES_ACTIVE=（空）/其它 profile

quant:
  kuangrui:
    enabled: true
    static-enabled: true
    config-dir: ${QUANT_KUANGRUI_CONFIG_DIR:config/kuangrui/local}
    mds:
      enabled: true
      config-file: mds_api_config.json
    oes:
      enabled: true
      # 报撤试单；仅仿真联调时打开。纸面走柜台还需 trade-mode=sdk
      order-enabled: true
      config-file: oes_api_config.json
